<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Factorio Optimizer</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
  <h1>Factorio Optimizer</h1>
  <nav>
    <button data-tab="jobs" class="active">Jobs</button>
    <button data-tab="runs">Runs</button>
  </nav>
  <label class="toggle" title="Draw machines and items with the game's own icons (needs Factorio installed)">
    <input type="checkbox" id="useSprites" checked> game icons
  </label>
</header>

<main>
  <section id="tab-jobs" class="tab active">
    <aside class="list">
      <div class="list-head">
        <strong>Job files</strong>
        <button id="newJob" title="Start a new job">New</button>
      </div>
      <input id="jobFilter" placeholder="filter">
      <ul id="jobList"></ul>
    </aside>
    <div class="editor">
      <div class="editor-head">
        <input id="jobPath" placeholder="jobs/my_job.json" spellcheck="false">
        <button id="saveJob">Save</button>
        <button id="validateJob">Check</button>
        <span id="jobMsg" class="msg"></span>
      </div>
      <div class="editor-body">
        <div id="form" class="form"></div>
        <div class="side">
          <div class="side-head">
            <strong>JSON</strong>
            <label class="toggle"><input type="checkbox" id="onlySet" checked> only what is set</label>
          </div>
          <textarea id="jsonText" spellcheck="false"></textarea>
          <div class="run-box">
            <strong>Run this job</strong>
            <input id="runOut" placeholder="solves/my_run" spellcheck="false">
            <input id="runRam" placeholder="RAM, e.g. 6g" size="8">
            <label class="toggle"><input type="checkbox" id="runResume"> resume</label>
            <button id="startRun">Start</button>
            <span id="runMsg" class="msg"></span>
          </div>
        </div>
      </div>
    </div>
  </section>

  <section id="tab-runs" class="tab">
    <aside class="list">
      <div class="list-head">
        <strong>Runs</strong>
        <button id="refreshRuns">Refresh</button>
      </div>
      <input id="runFilter" placeholder="filter">
      <ul id="runList"></ul>
    </aside>
    <div class="run-view">
      <div class="run-head">
        <strong id="runTitle">Pick a run</strong>
        <select id="layoutPick" title="Which layout to draw"></select>
        <label class="toggle" title="Colour machines by what they did in the game (verify_report.json)"><input type="checkbox" id="showVerify" checked> in-game status</label>
        <button id="stopRun" disabled title="Stop the run (a factory of blocks finishes its best factory so far)">Stop</button>
        <button id="verifyRun" title="Build the test copy in the real game and measure it (needs Factorio; takes minutes)">Verify in game</button>
        <button id="starveRun" title="Why machines starved in the last in-game check">Why short?</button>
        <span id="runState" class="msg"></span>
      </div>
      <div id="runCtl" class="run-ctl" hidden>
        <span class="grp">
          <button id="ctlPause" data-cmd="pause" title="No new turns until resumed (turns running finish)">Pause</button>
          <button data-cmd="stitch" title="Stitch a preview factory from the blocks now">Stitch now</button>
        </span>
        <span class="grp" title="When the block search ends (then the final factory is built)">
          <span class="lbl">time</span><b id="ctlLeft"></b>
          <button data-cmd="limit -300">−5 min</button><button data-cmd="limit +300">+5 min</button><button data-cmd="limit +1800">+30 min</button>
          <button data-cmd="limit none" title="Search until stopped">no limit</button>
          <input id="ctlLimit" size="4" placeholder="min" title="Minutes left from now"><button id="ctlLimitSet">set</button>
        </span>
        <span class="grp" title="Blocks searched at the same time (each lane takes a share of the threads)">
          <span class="lbl">lanes</span><button id="ctlLanesDown">−</button><b id="ctlLanes"></b><button id="ctlLanesUp">+</button>
        </span>
        <span class="grp"><button id="ctlFocusOff" data-cmd="focus off" title="Every block back in turn">focus off</button></span>
        <span class="grp">
          <button data-cmd="stop" title="Finish the turns running, then build the final factory">Finish</button>
          <button data-cmd="stop now" class="danger" title="Stop at once, keeping the best factory so far">Stop now</button>
          <button id="ctlKill" class="danger" title="Kill the process (only runs started from here); nothing more is saved">Kill</button>
        </span>
        <span id="ctlFlags" class="msg"></span>
      </div>
      <div class="run-body">
        <div class="canvas-wrap">
          <canvas id="view"></canvas>
          <div id="stages" class="stages" hidden></div>
          <div id="tip" class="tip"></div>
          <div class="hint">drag to pan, wheel to zoom, double-click to fit</div>
        </div>
        <div class="side-drag" id="sideDrag" title="Drag to widen the panel"></div>
        <div class="run-side">
          <div id="statusBox"></div>
          <div id="blocksBox"></div>
          <details id="historyBox" hidden><summary>History</summary><div id="historyBody"></div></details>
          <details id="starveBox" hidden open><summary>Why short</summary><pre id="starveText"></pre></details>
          <details id="verifyBox" hidden><summary>In-game check</summary><pre id="verifyText"></pre></details>
          <details open><summary>Log</summary><pre id="logBox"></pre></details>
        </div>
      </div>
    </div>
  </section>
</main>
<script src="/static/app.js"></script>
</body>
</html>
