[mod-setting-name]
factory-flow-enabled=Control tagged factories
factory-flow-pull=Run machines only while their products are waited for
factory-flow-quotas=Hold machines ahead of their plan while others behind wait
factory-flow-quota-factor=Quota: times the planned intake
factory-flow-gates=Keep overflow belts closed until a maker would stop

[mod-setting-description]
factory-flow-enabled=Off: every machine, inserter and belt the mod stopped runs again, and the mod does nothing.
factory-flow-pull=A machine runs while a machine it feeds (by belt or by hand) waits for one of its products, or while it makes a target. Machines whose outputs could not be traced always run.
factory-flow-quotas=A machine that has taken more of an item or fluid than its plan (times the factor, plus two crafts) has the inserters bringing that item stopped, or for a fluid is stopped itself, while a machine still behind its own plan waits for it anywhere in the factory.
factory-flow-quota-factor=How far ahead of its planned intake a machine may get before it gives way.
factory-flow-gates=On each overflow port's belt, the belt just past the last machine taking from it stops while a machine on it waits, or while no machine putting onto it stands with a full output. Items queue in front of their users instead of leaving.
