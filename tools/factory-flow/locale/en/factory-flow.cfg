[mod-setting-name]
factory-flow-enabled=Control tagged factories
factory-flow-pull=Run machines only while their products are waited for
factory-flow-pull-ahead=Pull ahead: crafts a user may hold before its makers stop
factory-flow-stock=Stock: crafts every machine keeps of each ingredient, even when off
factory-flow-side-cap=Side-product cap: times its plan a machine may run for a by-product
factory-flow-quotas=Hold machines ahead of their plan while others behind wait
factory-flow-quota-factor=Quota: times the planned intake
factory-flow-quota-window=Quota window (minutes)
factory-flow-gates=Keep overflow belts closed until a maker would stop

[mod-setting-description]
factory-flow-enabled=Off: every machine, inserter and belt the mod stopped runs again, and the mod does nothing.
factory-flow-pull=A machine runs while a machine it feeds (by belt or by hand) waits for one of its products, or while it makes a target. Machines whose outputs could not be traced always run.
factory-flow-quotas=A machine that has taken more of an item or fluid than its plan (times the factor, plus two crafts) has the inserters bringing that item stopped, or for a fluid is stopped itself, while a machine still behind its own plan waits for it anywhere in the factory.
factory-flow-stock=0: a machine switched off waits for nothing, so a long chain stays off level by level. Above 0: every machine, on or off, keeps that many crafts' worth of each ingredient and its makers run until it does: the chain stays primed and answers demand at once.
factory-flow-side-cap=0: off. Above 0: a machine wanted only for a product it was not planned for (not its main product) runs no faster than that many times its planned rate, so a trace by-product cannot drive it into making far more of everything else than anyone takes.
factory-flow-pull-ahead=1: a machine's makers run only once it stands short. Above 1: also while it works with less than that many crafts' worth of an ingredient, so the makers' crafts and the belt trip overlap its own.
factory-flow-quota-factor=How far ahead of its planned intake a machine may get before it gives way.
factory-flow-quota-window=0: a quota counts what a machine took since it was built. Above 0: only what it took in that many last minutes, so a machine that ran ahead early on is not held for hours.
factory-flow-gates=On each overflow port's belt, the belt just past the last machine taking from it stops while a machine on it waits, or while no machine putting onto it stands with a full output. Items queue in front of their users instead of leaving.
