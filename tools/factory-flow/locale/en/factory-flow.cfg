[mod-setting-name]
factory-flow-enabled=Control tagged factories
factory-flow-pull=Run machines only while their products are waited for
factory-flow-pull-ahead=Pull ahead: crafts a user may hold before its makers stop
factory-flow-stock=Stock: crafts every machine keeps of each ingredient, even when off
factory-flow-side-cap=Side-product cap: times its plan a machine may run for a by-product
factory-flow-rate-cap=Rate cap: times its plan any machine may run
factory-flow-requester-demand=Requester demand: keep robot-link requesters stocked
factory-flow-quotas=Hold machines ahead of their plan while others behind wait
factory-flow-quota-factor=Quota: times the planned intake
factory-flow-quota-window=Quota window (minutes)
factory-flow-gates=Keep overflow belts closed until a maker would stop
factory-flow-loop-first=A production loop's own users come first
factory-flow-loop-strict=Loop first, strictly
factory-flow-loop-stock=Loop stock: crafts a loop's own users hold before others may take (0: off)
factory-flow-loop-keep=Loop keep: crafts a loop's own users ask for even while switched off (0: off)
factory-flow-loop-keep-time=Loop keep in time: seconds of planned use a loop's own users ask for (0: off)
factory-flow-loop-share=Loop share: a maker serves a waiting loop user's belt first
factory-flow-loop-fluids=Loop fluids: fluid loops first too
factory-flow-quota-catalyst=Quota catalyst: no quota on what a recipe gives back
factory-flow-loop-dead-end=Loop dead end: no loop item onto a belt nobody takes it from
factory-flow-loop-short-on=Loop short on: only switched-on loop users hold the others
factory-flow-loop-short-reach=Loop short reach: hold only outside users that share supply with the short loop user
factory-flow-loop-fluid-strict=Loop fluid strict: a fluid loop user short holds outside users however far ahead it runs
factory-flow-share-wait-on=Share wait on: only a switched-on user counts as waiting when a maker shares out
factory-flow-splitter-priority=Splitter priority: a branching splitter sends first to the side where a machine waits
factory-flow-reserve=Reserve: tiles of queue kept at a loop's own users (0: off)
factory-flow-shares=A machine with several output belts gives each its share
factory-flow-slow-machines=Hold slow machines to their plan over a longer time
factory-flow-cap-fill=A capped machine still runs for a user behind its plan

[mod-setting-description]
factory-flow-enabled=Off: every machine, inserter and belt the mod stopped runs again, and the mod does nothing.
factory-flow-pull=A machine runs while a machine it feeds (by belt or by hand) waits for one of its products, or while it makes a target. Machines whose outputs could not be traced always run.
factory-flow-quotas=A machine that has taken more of an item or fluid than its plan (times the factor, plus two crafts) has the inserters bringing that item stopped, or for a fluid is stopped itself, while a machine still behind its own plan waits for it anywhere in the factory.
factory-flow-stock=0: a machine switched off waits for nothing, so a long chain stays off level by level. Above 0: every machine, on or off, keeps that many crafts' worth of each ingredient and its makers run until it does: the chain stays primed and answers demand at once.
factory-flow-side-cap=0: off. Above 0: a machine wanted only for a product it was not planned for (not its main product) runs no faster than that many times its planned rate, so a trace by-product cannot drive it into making far more of everything else than anyone takes.
factory-flow-rate-cap=0: off. Above 0: no machine runs faster than that many times its planned rate over the last ten minutes, whatever wants it (the target's makers aside), so loops and machines with several products cannot spin far past their plan and take what other chains need.
factory-flow-requester-demand=A robot link's requester chest holding less than its request counts as a machine waiting for the item, so its makers keep it stocked instead of waiting until the machines past it run short.
factory-flow-pull-ahead=1: a machine's makers run only once it stands short. Above 1: also while it works with less than that many crafts' worth of an ingredient, so the makers' crafts and the belt trip overlap its own.
factory-flow-quota-factor=How far ahead of its planned intake a machine may get before it gives way.
factory-flow-quota-window=0: a quota counts what a machine took since it was built. Above 0: only what it took in that many last minutes, so a machine that ran ahead early on is not held for hours.
factory-flow-gates=On each overflow port's belt, the belt just past the last machine taking from it stops while a machine on it waits, or while no machine putting onto it stands with a full output. Items queue in front of their users instead of leaving.
factory-flow-loop-first=A user of an item whose own products lead back to a maker of that item within three recipes is in the item's loop. Any other user is held from the item while one in the loop stands short of it and took less than its plan in the last half hour. Overflow belts that carry such an item, or a loop's carrier, stay closed.
factory-flow-shares=Where one machine puts an item onto several belts, the belt of a user waiting for it comes first. When nobody waits, a belt ahead of its planned share is held while one behind it has room.
factory-flow-slow-machines=The rate cap and the quotas allow a few crafts over the plan in their window, which for a machine planned for a craft every half hour is many times its plan. On: such a machine is counted over the time three of its planned crafts take (four hours at most), with one craft over.
factory-flow-loop-strict=Off: users outside a loop wait only while a user in the loop is short and behind its plan. On: whenever a user in the loop is short.
factory-flow-cap-fill=A machine at its rate cap keeps running while a user that is itself behind its plan waits for one of its products: a belt has to fill once from its end back to each user. A user ahead of its own plan gets no such leave.
factory-flow-reserve=Past the last of a loop's own users on a belt, the belt stays stopped until that many tiles in front of it are full, so a queue of the loop's item stands at those users before anything goes on to other users or the belt's end. Without it a loop's stock can end up parked past the users that need it.
factory-flow-loop-stock=Above 0: users outside a loop also wait while a loop user that is switched on holds less than that many crafts' worth of the loop's item, so what the loop makes stays in the loop until its own users are full.
factory-flow-loop-keep=Above 0: a loop's own user asks for the loop's item while it holds less than that many crafts' worth, switched off or not, so its makers run and their belts carry it there before its stock is gone.
factory-flow-loop-keep-time=Above 0: as loop keep, counted in time: a loop's own user asks for the loop's item while it holds less than that many seconds of its planned use (the larger of the two counts). Two crafts of a recipe that takes one item a craft are no reserve.
factory-flow-loop-share=Where a maker feeds several belts, one on which a user in the item's own loop waits comes before every other, whatever the plan's shares.
factory-flow-loop-fluids=On: a fluid's production loop comes first too. A user outside the loop (tagged by tag.py) is switched off while one of the loop's own users stands short of the fluid and behind its plan; a fluid cannot be held at an inserter.
factory-flow-quota-catalyst=On: an ingredient the recipe gives back at least as much of as it takes (a catalyst, such as the outlet gas Py's brick heaters pass on to each other) is never held by the quotas: taking it deprives nobody.
factory-flow-loop-dead-end=On: a maker never puts a production loop's item onto a belt with no user of it; the belt's port is shut for loop items, so it could only park there, and a loop's whole stock can end up on such a belt. Held only while the maker has another belt free to take, so the maker never stands full for it.
factory-flow-loop-short-on=On: users outside a loop are held for a loop user standing short only while that user is switched on; one switched off takes nothing.
factory-flow-loop-short-reach=On: a loop user standing short holds a user outside the loop only if that user takes from one of its belt networks or is fed by a maker that also feeds it; a loop user whose belt nobody else feeds no longer holds the others for good.
factory-flow-loop-fluid-strict=On: a fluid loop's user standing short of the fluid switches off the users outside the loop even while it runs ahead of its plan; a fluid loop that reaches zero never restarts.
factory-flow-share-wait-on=On: when a maker shares an item between belts, a user that is switched off does not count as waiting for it, so its belt does not hold the others back.
factory-flow-splitter-priority=On: where a belt branches at a splitter, the splitter gives its output priority to the side where a machine waits for what it carries (a machine inside the item's own loop first), and none while both sides or neither wait.
